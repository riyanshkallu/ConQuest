# ConQuest v1.0, Congressional App Challenge 2026
# Render Blueprint: one free web service that serves both the API and the frontend.
# Set up once in the Render dashboard: New > Blueprint > pick this repo.
# No rootDir on purpose: frontend/ changes must trigger a redeploy too.
services:
  - type: web
    name: conquestgame
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    # One process only: each round has an in-memory cache and lock (it's also saved to the database).
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: live
      # Secrets: Render asks for these when the Blueprint is created. Never commit them.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Supabase "Session pooler" connection string (see backend/README.md). Without it the app
      # uses a SQLite file, which Render wipes on every redeploy.
      - key: DATABASE_URL
        sync: false
