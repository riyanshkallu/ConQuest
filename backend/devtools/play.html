<!DOCTYPE html>
<!--
  Backend test page, served at /play. NOT the real game UI (that's frontend/).
  It only uses the public API from api.md, so if this page can play a full round,
  the frontend can too. All AI text is inserted with textContent, never innerHTML.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outsmart test console</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #dde1e8;
    --me: #2563eb; --me-text: #ffffff; --them: #e9ecf1; --note: #fff7d6;
    --red: #c62828; --green: #1b7f3b; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3340;
      --me: #3b82f6; --them: #2a303c; --note: #3a3320; --red: #ef6b6b; --green: #4cc27a; --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select, input[type=text] {
    font: inherit; border-radius: 8px; border: 1px solid var(--line); padding: 8px 12px;
    background: var(--panel); color: var(--text);
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
  .idcard { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 14px; }
  .idcard dt { color: var(--muted); }
  .idcard dd { margin: 0; font-family: ui-monospace, Consolas, monospace; }
  #chat { height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px; }
  .contact-head { font-weight: 600; } .contact-head small { color: var(--muted); font-weight: 400; }
  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .them { align-self: flex-start; background: var(--them); border-bottom-left-radius: 4px; }
  .me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
  .system { align-self: center; background: var(--note); font-size: 13px; max-width: 95%; border-radius: 8px; }
  .link { color: var(--accent); text-decoration: underline; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
  .typing { align-self: flex-start; color: var(--muted); font-style: italic; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .chips button { font-size: 13px; padding: 6px 10px; border-radius: 999px; }
  #sendForm { display: flex; gap: 8px; } #sendForm input { flex: 1; min-width: 0; }
  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; margin-top: 8px; }
  .meta { color: var(--muted); font-size: 13px; }
  .ending h2 { margin: 0 0 4px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; }
  .tag.red { background: var(--red); } .tag.green { background: var(--green); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .t-entry { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .t-entry .who { font-weight: 600; } .t-entry .why { color: var(--muted); font-size: 13px; }
  .hidden { display: none; }
  .error { color: var(--red); }
</style>
</head>
<body>
<main>
  <h1>Outsmart test console</h1>
  <div class="sub">Backend test page for playing rounds against the real API. The real game screens live in <code>frontend/</code>.</div>

  <div class="panel row">
    <select id="scenario" aria-label="Scenario"></select>
    <button id="startBtn" class="primary">Start round</button>
    <button id="trainBtn" title="Starts a round that leads with your weakest Scam Radar tactic">Train my weakness</button>
    <label class="meta"><input type="checkbox" id="hints"> hints</label>
    <span class="meta" id="playerInfo"></span>
  </div>
  <div id="error" class="error"></div>

  <div id="game" class="hidden">
    <details class="panel" open>
      <summary><b>Your fictional ID card</b> (use only these details)</summary>
      <dl class="idcard" id="idcard"></dl>
    </details>

    <div class="panel">
      <div class="row" style="justify-content: space-between">
        <div class="contact-head" id="contact"></div>
        <div class="meta"><span id="turn"></span> <span id="hint"></span></div>
      </div>
      <div id="chat" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form id="sendForm">
        <input type="text" id="msg" maxlength="500" placeholder="Type a reply..." autocomplete="off">
        <button class="primary" id="sendBtn">Send</button>
      </form>
      <div class="actions">
        <button data-action="verify">Verify independently</button>
        <button data-action="ask_proof">Ask for proof</button>
        <button data-action="trust">It's legit</button>
        <button data-action="hang_up">Hang up / Block</button>
        <button data-action="report">Report as scam</button>
      </div>
    </div>
  </div>

  <div id="result" class="hidden"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { playerId: null, roundId: null, busy: false, ended: false };

// ---- API -------------------------------------------------------------------
async function api(method, path, body) {
  const res = await fetch("/api" + path, {
    method,
    headers: body ? { "content-type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error ? `${data.error.code}: ${data.error.message}` : `HTTP ${res.status}`);
  return data;
}

function store(key, value) { try { localStorage.setItem(key, value); } catch (_) {} }
function load(key) { try { return localStorage.getItem(key); } catch (_) { return null; } }

// ---- Small DOM helpers (textContent only, so AI text can never become HTML) ----
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}
function showError(err) { $("error").textContent = err ? String(err.message || err) : ""; }
function scrollChat() { $("chat").scrollTop = $("chat").scrollHeight; }

function addBubble(msg) {
  const cls = msg.sender === "player" ? "me" : msg.sender === "contact" ? "them" : "system";
  const bubble = el("div", "bubble " + cls);
  // Split the text around each link so links become tappable buttons.
  let rest = msg.text;
  for (const link of msg.links || []) {
    const at = rest.indexOf(link);
    if (at < 0) continue;
    bubble.append(rest.slice(0, at));
    const a = el("button", "link", link);
    a.type = "button";
    a.onclick = () => openLink(link);
    bubble.append(a);
    rest = rest.slice(at + link.length);
  }
  bubble.append(rest);
  $("chat").append(bubble);
  scrollChat();
  return bubble;
}

function setBusy(busy) {
  state.busy = busy;
  const off = busy || state.ended;
  for (const b of document.querySelectorAll("#game button, #msg")) b.disabled = off;
  $("typing")?.remove();
  if (busy) { $("chat").append(Object.assign(el("div", "typing", "typing..."), { id: "typing" })); scrollChat(); }
}

function setChips(replies) {
  $("chips").replaceChildren(...(replies || []).map((r) => {
    const b = el("button", "", r);
    b.type = "button";
    b.onclick = () => send(r);
    return b;
  }));
}

function updateMeta(resp) {
  $("turn").textContent = `Turn ${resp.turn} of ${resp.max_turns}`;
  $("hint").textContent = resp.hint ? `· caution meter ${resp.hint.suspicion}` : "";
}

// ---- Game flow ---------------------------------------------------------------
async function init() {
  try {
    state.playerId = load("outsmart_test_player");
    if (state.playerId) {
      try { await api("GET", `/player/${state.playerId}/radar`); } catch (_) { state.playerId = null; }
    }
    if (!state.playerId) {
      state.playerId = (await api("POST", "/player", {})).player_id;
      store("outsmart_test_player", state.playerId);
    }
    $("playerInfo").textContent = "player " + state.playerId;
    const { scenarios } = await api("GET", `/scenarios?player_id=${state.playerId}`);
    $("scenario").replaceChildren(...scenarios.map((s) => {
      const o = el("option", "", `${s.title} (${s.channel}, difficulty ${s.difficulty})`);
      o.value = s.id;
      return o;
    }));
  } catch (err) { showError(err); }
}

async function trainWeakness() {
  showError();
  try {
    const { train_your_weakness: pick } = await api("GET", `/scenarios?player_id=${state.playerId}`);
    if (!pick) { showError("Play a round first: there's no Scam Radar data yet."); return; }
    await startRound(pick.scenario_id, pick.category);
  } catch (err) { showError(err); }
}

async function startRound(scenarioId, focus) {
  showError();
  try {
    const body = { player_id: state.playerId, scenario_id: scenarioId || $("scenario").value };
    if (focus) body.focus = focus;
    const r = await api("POST", "/round/start", body);
    Object.assign(state, { roundId: r.round_id, ended: false });
    $("result").classList.add("hidden");
    $("game").classList.remove("hidden");
    $("chat").replaceChildren();

    const card = r.id_card;
    const rows = [["Name", card.name], ["Email", card.email], ["Phone", card.phone], ["Bank", card.bank],
                  ["Card", card.card_number], ["Password", card.password],
                  ["Gift card", card.gift_card && `${card.gift_card.store} $${card.gift_card.amount}: ${card.gift_card.code}`],
                  ["Gaming", card.gaming_account && `${card.gaming_account.game}: ${card.gaming_account.username}`],
                  ["Family", card.family && card.family.relative],
                  ["Their parent", card.family && `${card.family.parent}, ${card.family.parent_phone}`],
                  [card.family && card.family.memory_question, card.family && card.family.memory_answer],
                  ...(card.extras || []).map((x) => [x.label, x.value])];
    $("idcard").replaceChildren(...rows.filter(([, v]) => v).flatMap(([k, v]) => [el("dt", "", k), el("dd", "", v)]));

    $("contact").replaceChildren(r.contact.name + " ", el("small", "", `${r.contact.handle} · ${r.channel}`),
                                 r.focus ? el("small", "", ` · training: ${r.focus.label}`) : "");
    updateMeta({ turn: 0, max_turns: r.max_turns, hint: null });
    addBubble(r.opening_message);
    setChips(r.suggested_replies);
    setBusy(false);
    $("msg").focus();
  } catch (err) { showError(err); }
}

async function send(text) {
  text = text.trim();
  if (!text || state.busy || state.ended) return;
  showError();
  $("msg").value = "";
  const mine = addBubble({ sender: "player", text, links: [] });
  setBusy(true);
  try {
    const r = await api("POST", `/round/${state.roundId}/message`, { text });
    if (r.blocked) {
      mine.remove();  // the blocked text was never sent, so don't show it as sent
      addBubble({ sender: "notification", text: "Blocked: " + r.blocked_reason, links: [] });
    }
    handleTurn(r);
  } catch (err) { showError(err); setBusy(false); }
}

async function act(action) {
  if (state.busy || state.ended) return;
  showError();
  setBusy(true);
  try {
    const r = await api("POST", `/round/${state.roundId}/action`, { action });
    if (r.player_message) addBubble(r.player_message);
    if (r.verification_call) {
      addBubble({ sender: "notification", text: "📞 " + r.verification_call.title, links: [] });
      for (const line of r.verification_call.lines) {
        addBubble({ sender: line.speaker === "player" ? "player" : "contact", text: line.text, links: [] });
      }
    }
    handleTurn(r);
  } catch (err) { showError(err); setBusy(false); }
}

async function openLink(link) {
  if (state.busy || state.ended) return;
  try {
    await api("POST", `/round/${state.roundId}/action`, { action: "open_link", link });
    addBubble({ sender: "notification", text: `You opened ${link}. (In the real game this shows a fake website.)`, links: [] });
  } catch (err) { showError(err); }
}

function handleTurn(r) {
  if (r.reply) addBubble(r.reply);
  for (const n of r.notifications || []) addBubble(n);
  if (r.coach_tip) addBubble({ sender: "notification", text: "💡 Tip: " + r.coach_tip, links: [] });
  updateMeta(r);
  setChips(r.suggested_replies);
  state.ended = r.ended;
  setBusy(false);
  if (r.ended) showResult();
}

// ---- Result: reveal, autopsy, transcript, radar ------------------------------
async function showResult() {
  try {
    const [res, radar] = await Promise.all([
      api("GET", `/round/${state.roundId}/result`),
      api("GET", `/player/${state.playerId}/radar`),
    ]);
    const box = $("result");
    box.replaceChildren();
    box.classList.remove("hidden");

    const end = el("div", "panel ending");
    const tag = el("span", "tag " + (res.ending.is_scam ? "red" : "green"), res.ending.is_scam ? "This was a SCAM" : "This was LEGIT");
    end.append(tag, el("h2", "", res.ending.title), el("div", "", res.ending.message),
               el("p", "", "Biggest clue: " + res.biggest_clue));
    const again = el("button", "primary", "Play again");
    again.onclick = () => startRound();
    end.append(again);
    box.append(end);

    const pts = el("div", "panel");
    pts.append(el("b", "", `Points: ${res.points} · XP earned: ${res.xp_earned}`));
    const pt = el("table");
    for (const p of res.points_breakdown) {
      const tr = el("tr"); tr.append(el("td", "", p.label), el("td", "num", (p.points > 0 ? "+" : "") + p.points)); pt.append(tr);
    }
    pts.append(pt);
    if (res.new_badges.length) pts.append(el("p", "", "New badges: " + res.new_badges.map((b) => b.name).join(", ")));
    box.append(pts);

    const ex = res.explanation;
    const exp = el("div", "panel");
    exp.append(el("b", "", ex.type === "scam_autopsy" ? "Scam Autopsy" : "Legit Breakdown"));
    const tl = el("table");
    for (const c of ex.timeline) {
      const tr = el("tr");
      tr.append(el("td", "", `Turn ${c.turn}`), el("td", "", c.flag.label), el("td", "", c.player_response.replaceAll("_", " ")));
      tl.append(tr);
    }
    exp.append(tl);
    if (ex.best_decision) exp.append(el("p", "", "Best decision: " + ex.best_decision));
    if (ex.biggest_weakness) exp.append(el("p", "", "Biggest weakness: " + ex.biggest_weakness.label));
    if (ex.mistakes.length) exp.append(el("p", "", "Mistakes: " + ex.mistakes.join(" · ")));
    if (ex.scam_twin) exp.append(el("p", "", `Scam version ("${ex.scam_twin.contact_name}"): ${ex.scam_twin.text}`));
    exp.append(el("p", "", "Tip: " + res.tip.text));
    box.append(exp);

    const tr = el("details", "panel");
    tr.append(el("summary", "", "Flagged transcript"));
    for (const m of res.transcript) {
      const row = el("div", "t-entry");
      row.append(el("span", "who", m.sender + ": "), m.text);
      if (m.flag) row.append(el("div", "why", `${m.flag.kind === "red" ? "🚩" : "✅"} ${m.flag.label}: ${m.flag.explanation}`));
      if (m.note) row.append(el("div", "why", "📝 " + m.note));
      tr.append(row);
    }
    box.append(tr);

    const rd = el("div", "panel");
    rd.append(el("b", "", `Scam Radar · level ${radar.level} · ${radar.xp} XP · streak ${radar.streak_days} day(s)`));
    const rt = el("table");
    for (const r of radar.radar) {
      const row = el("tr");
      row.append(el("td", "", r.label), el("td", "num", `${r.resisted}/${r.encountered}`),
                 el("td", "num", r.percent === null ? "–" : r.percent + "%"));
      rt.append(row);
    }
    rd.append(rt);
    box.append(rd);
    box.scrollIntoView({ behavior: "smooth" });
  } catch (err) { showError(err); }
}

// ---- Wire up -------------------------------------------------------------------
$("startBtn").onclick = () => startRound();
$("trainBtn").onclick = trainWeakness;
$("sendForm").onsubmit = (e) => { e.preventDefault(); send($("msg").value); };
for (const b of document.querySelectorAll("[data-action]")) b.onclick = () => act(b.dataset.action);
$("hints").onchange = async (e) => {
  try { await api("PATCH", `/player/${state.playerId}/settings`, { hints: e.target.checked }); }
  catch (err) { showError(err); }
};
init();
</script>
</body>
</html>
